description: 'Mother Games is a Brooklyn, New York consumer gaming studio backed by
  GV (Google Ventures). As of mid-2026 the company is pre-launch: it operates a public
  waitlist for its debut social title "Le Zoo" and runs a campus ambassador program
  from its Williamsburg mailbox address (223 Bedford Ave #200, Brooklyn, NY 11211).
  Mother Games does not currently expose any public developer API, SDK, documentation,
  or developer platform surface — probes of the domain returned 404 for every /.well-known/,
  /llms.txt, /openapi.json, /api, /docs, and /developers path. This profile tracks
  the company identity and public web properties in the API Evangelist network as a
  portfolio lead pending any future developer platform.'
